<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120" role="img" aria-label="Walking Paintbrush Foundation">

  <!-- ─── The Mark: A single walking brushstroke ─── -->
  <!-- Starts thin on the left, swells through the center, tapers right -->
  <!-- Angled upward left→right — the motion of a stride -->

  <!-- Primary brushstroke body: Garden Stem Green -->
  <path d="
    M 18,62
    C 44,44 88,24 152,22
    C 206,20 258,28 292,40
    L 290,52
    C 256,64 206,68 152,68
    C 88,68 44,72 18,70
    Z
  " fill="#2F5D3A"/>

  <!-- Inner luminance layer — lighter center, gives depth like wet paint -->
  <path d="
    M 50,56
    C 82,40 120,30 164,28
    C 210,26 258,34 288,44
    L 288,48
    C 258,38 210,32 164,34
    C 120,36 82,46 50,62
    Z
  " fill="#3d7a4e" opacity="0.35"/>

  <!-- Leading edge shadow — darker at the taper point, like a brush tip -->
  <path d="
    M 18,62
    C 28,58 38,54 50,52
    C 38,56 28,62 18,70
    Z
  " fill="#1e3d26" opacity="0.4"/>

  <!-- ─── Wordmark ─── -->
  <!-- Walking Paintbrush — Playfair Display quality, spaced -->
  <text
    x="160" y="90"
    font-family="'Playfair Display', 'Georgia', serif"
    font-size="14"
    font-weight="400"
    letter-spacing="3.5"
    text-anchor="middle"
    fill="#1C1C1C">WALKING PAINTBRUSH</text>

  <!-- Foundation — Inter, smaller, green, wider tracking -->
  <text
    x="160" y="107"
    font-family="'Inter', 'Arial', sans-serif"
    font-size="8"
    font-weight="500"
    letter-spacing="5.5"
    text-anchor="middle"
    fill="#2F5D3A">FOUNDATION</text>

</svg>
